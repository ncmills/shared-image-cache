name: Daily Unsplash max-out

# A dedicated daily agent that pushes the shared cache toward completeness at
# the MAXIMUM utilization the Unsplash API allows in a single window.
#
# Rate math (demo tier): each key = 50 requests/hour. We pool 3 keys
# (round-robined per request) = ~150 requests/hour of headroom. The fetcher
# round-robins keys and stops on its own at RATELIMIT_FLOOR, so a single
# `--limit=150` pass consumes essentially the entire hourly budget and then
# exits cleanly — the most images we can legally pull in one run.
#
# This runs ALL projects (no --project filter): the queue auto-skips
# already-cached keys, so whatever is newest/most-incomplete (currently the
# offsite backfill of ~337 entries) is filled first. Over consecutive days it
# converges the whole cache, then idles ("nothing to fetch") cheaply.
#
# Complements fetch-images.yml (every-2h incremental top-up). Shares the
# `fetch-images` concurrency group so the two never race on cache.json.

on:
  schedule:
    # 09:13 UTC daily (off the :00 contention window).
    - cron: '13 9 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max queries this run (≈ full hourly budget across 3 keys)'
        required: false
        default: '150'

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  maxout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        # `npm ci`, not `npm install`: ci resolves the lockfile from scratch, install may
        # reuse or loosely satisfy an existing tree. These crons WRITE to the cache and push,
        # and they run the duplicate-fanout gate on the way — so they must run against the
        # pinned dependency set, not a resolved-nearby one. Confirmed twice on 2026-08-20 that
        # a stale installed tree makes a check pass locally while every cold build fails
        # (reference_npm_git_dep_lockfile_stale); the fix has to be mechanical, not remembered.
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "shared-image-cache bot"
          git config user.email "actions@github.com"

      - name: Fetch — ALL projects, max budget
        id: fetch
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_ACCESS_KEY_2: ${{ secrets.UNSPLASH_ACCESS_KEY_2 }}
          UNSPLASH_ACCESS_KEY_3: ${{ secrets.UNSPLASH_ACCESS_KEY_3 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          before=$(git rev-parse HEAD)
          npx tsx scripts/fetch.ts --limit=${{ inputs.limit || '150' }} --commit
          after=$(git rev-parse HEAD)
          if [ "$before" != "$after" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # which consumer projects gained entries this run (added JSON keys in the diff)
            # The alternation below MUST match scripts/loaders.ts. It read
            # `(offsite|bestman|moh|tdf)` for months, so friendsmoon and
            # engagedmoon could gain images and never trigger a rebuild — a
            # grep that matches nothing prints nothing and exits 0.
            # scripts/check-workflow-projects.ts now fails CI on any drift.
            projects=$(git show "$after" -- cache.json | grep -E '^\+' | grep -oE '"(offsite|bestman|moh|tdf|friendsmoon|engagedmoon)/' | tr -d '"/' | sort -u | tr '\n' ' ')
            echo "projects=$projects" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Print stats
        run: npm run stats

      # Identify the remaining image gaps (per site + per category) AFTER this
      # run's pull, so the cache's convergence is visible day over day in the
      # run summary. Read-only; the fetcher above already pulled what it could
      # under the API ceiling, and gaps are expected to shrink each day.
      # Now covers all six projects (scripts/loaders.ts), and separates
      # "missing" from "missing and unreachable" (tombstoned) so a queue that
      # has stopped advancing is visible instead of inferred.
      - name: Report remaining image gaps
        run: npx tsx scripts/gap-report.ts --write-summary

      # Consumer sites pull the shared cache at build time (prebuild sync), so a
      # cache change only reaches a live site on its next deploy. Ping the deploy
      # hook for each site that gained images this run — keeps the freshest, most
      # relevant photos paired with their content within a day, no manual redeploy.
      - name: Refresh consumer sites that gained images
        if: steps.fetch.outputs.changed == 'true'
        env:
          HOOK_BESTMAN: ${{ secrets.HOOK_BESTMAN }}
          HOOK_MOH: ${{ secrets.HOOK_MOH }}
          HOOK_TDF: ${{ secrets.HOOK_TDF }}
          HOOK_OFFSITE: ${{ secrets.HOOK_OFFSITE }}
          # NOT YET CREATED. Both resolve to "" until the owner adds them, and
          # the refresh below says so out loud, per site, in the step summary.
          # An unset secret must never read as "nothing to do".
          HOOK_FRIENDSMOON: ${{ secrets.HOOK_FRIENDSMOON }}
          HOOK_ENGAGEDMOON: ${{ secrets.HOOK_ENGAGEDMOON }}
        run: |
          set -u
          projects="${{ steps.fetch.outputs.projects }}"
          echo "Projects with new images this run: ${projects:-none}"
          echo "### Consumer refresh" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          refresh () {
            local token="$1" hook="$2" secret="$3"
            if echo " $projects " | grep -q " $token "; then
              if [ -z "$hook" ]; then
                # Say exactly what did not happen and why. The old message
                # ("no deploy hook configured") did not name the secret and did
                # not say that the images will now sit unpublished.
                echo "::warning::$token gained images but the repo secret $secret is NOT SET — NO rebuild was triggered. Those images stay invisible on the live site until its next deploy for some other reason."
                echo "- ⚠️ **$token** — new images, but \`$secret\` is not configured. **No rebuild fired.**" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$hook")
              if [ "$code" = "200" ] || [ "$code" = "201" ]; then
                echo "✓ $token rebuild triggered ($code)"
                echo "- ✅ **$token** — rebuild triggered ($code)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::$token rebuild failed (HTTP $code)"
                echo "- ❌ **$token** — rebuild FAILED (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
                fail=1
              fi
            else
              echo "· $token unchanged — no rebuild"
            fi
          }
          refresh bestman     "$HOOK_BESTMAN"     HOOK_BESTMAN
          refresh moh         "$HOOK_MOH"         HOOK_MOH
          refresh tdf         "$HOOK_TDF"         HOOK_TDF
          refresh offsite     "$HOOK_OFFSITE"     HOOK_OFFSITE
          refresh friendsmoon "$HOOK_FRIENDSMOON" HOOK_FRIENDSMOON
          refresh engagedmoon "$HOOK_ENGAGEDMOON" HOOK_ENGAGEDMOON
          if [ "$fail" = "1" ]; then
            echo "One or more rebuilds failed — see errors above."; exit 1
          fi
          echo "Per-site refresh complete."
