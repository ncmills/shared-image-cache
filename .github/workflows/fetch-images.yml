name: Fetch Unsplash images

# Runs the shared-image-cache fetcher on a schedule, writing new entries
# back to the repo. Replaces the local nohup bash loop — runs entirely
# on GitHub's free Actions tier for public repos.
#
# Schedule: every 2 hours. Each run processes ~90 queries across 3 keys
# (60% utilization per key, 30/key max). Exits early if cache is up to date.
#
# Keys: set as repo secrets via `gh secret set` — see infra docs.

on:
  schedule:
    # Every 2 hours at :07 past the hour (avoids the :00 contention window
    # where most cron jobs fire and GitHub scheduler delays runs by 10+ min).
    - cron: '7 */2 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to fetch (tdf, bestman, moh, offsite, friendsmoon, engagedmoon, or blank for all)'
        required: false
        default: ''
      limit:
        description: 'Total queries this run (shared across projects, round-robin)'
        required: false
        default: '350'

# Only one fetch run at a time — prevents two workflows committing conflicting
# cache.json snapshots (cache.json is a single file, concurrent writes race).
concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Opt into Node 24 for the JS actions (actions/checkout, setup-node).
    # GitHub is forcing this switchover June 2026; preempting silences the
    # deprecation warning that shows on every run.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We'll commit back, so we need full history + write access.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        # `npm ci`, not `npm install`: ci resolves the lockfile from scratch, install may
        # reuse or loosely satisfy an existing tree. These crons WRITE to the cache and push,
        # and they run the duplicate-fanout gate on the way — so they must run against the
        # pinned dependency set, not a resolved-nearby one. Confirmed twice on 2026-08-20 that
        # a stale installed tree makes a check pass locally while every cold build fails
        # (reference_npm_git_dep_lockfile_stale); the fix has to be mechanical, not remembered.
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "shared-image-cache bot"
          git config user.email "actions@github.com"

      # ONE global fetch, not one step per project.
      #
      # lib/queue.ts round-robin interleaves pending keys by project prefix, so
      # a single run already gives every project with backlog a fair share —
      # and it apportions by ACTUAL BACKLOG rather than by six numbers somebody
      # picked once. The old shape had reserved 15 slots for friendsmoon and 10
      # for engagedmoon while both sat at 100% cached, and capped MOH at 15 with
      # 587 keys outstanding.
      #
      # It is also the shape that keeps up as shared-data grows: a wizard that
      # gains 40 destinations starts drawing more of each run automatically,
      # with nobody editing this file.
      - name: Fetch — all projects (round-robin by backlog)
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_ACCESS_KEY_2: ${{ secrets.UNSPLASH_ACCESS_KEY_2 }}
          UNSPLASH_ACCESS_KEY_3: ${{ secrets.UNSPLASH_ACCESS_KEY_3 }}
          # Tier 3, and tier 1 once Unsplash's hourly budget is spent. This
          # workflow ran without it for months, so every 2-hourly run had Pexels
          # silently disabled while daily-maxout had it on — the two crons were
          # not fetching from the same set of sources.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Dispatch inputs reach the shell as ENV, never spliced into the script
          # text. `${{ }}` inside a `run:` block is substituted by the runner
          # BEFORE bash sees the line, so an input carrying a quote or a `;`
          # becomes script rather than an argument — in this job, script running
          # beside three Unsplash keys and a Pexels key. Values arriving as env
          # are data bash reads, and cannot become syntax.
          INPUT_PROJECT: ${{ inputs.project }}
          INPUT_LIMIT: ${{ inputs.limit || '350' }}
        run: |
          PROJECT_ARG=""
          if [ -n "$INPUT_PROJECT" ]; then
            PROJECT_ARG="--project=$INPUT_PROJECT"
          fi
          npx tsx scripts/fetch.ts $PROJECT_ARG --limit="$INPUT_LIMIT" --commit

      - name: Print stats
        run: npm run stats
